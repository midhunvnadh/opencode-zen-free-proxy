name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  image:
    name: docker image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Both supported architectures, so a broken musl build or a missing
      # platform manifest fails here rather than on someone else's server.
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A single-platform build is loaded into the daemon so the artefacts can
      # actually be executed; it reuses the layers cached by the step above.
      - name: Load a native image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: oc-proxy:ci
          cache-from: type=gha

      - name: The bundled proxy is executable
        run: docker run --rm --entrypoint sh oc-proxy:ci -c 'test -x /app/proxy && echo "proxy executable"'

      - name: The bundled opencode runs
        run: docker run --rm oc-proxy:ci opencode --version

      - name: Nothing from the build leaked into the image
        run: |
          docker run --rm --entrypoint sh oc-proxy:ci -c '
            test ! -e /app/node_modules || { echo "node_modules leaked"; exit 1; }
            test ! -e /app/src       || { echo "TypeScript sources leaked"; exit 1; }
            test ! -e /usr/local/bun || { echo "bun leaked into the runtime"; exit 1; }
            echo "runtime image is clean"'
